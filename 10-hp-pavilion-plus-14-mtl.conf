# =====================================================================
# HP Pavilion Plus 14 (14-ew1xxx) – Core Ultra 5 125H Meteor Lake-P
# TLP 1.10.x – Arch Linux – Hyprland
# =====================================================================
# ---------- Operation ----------
TLP_ENABLE=1
TLP_AUTO_SWITCH=2
# "smart": a manually chosen power-saver survives p
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=BAL
NMI_WATCHDOG=0
# change to SAV if you want power-saver on every un
# ---------- CPU: intel_pstate active mode + HWP ----------
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active
CPU_DRIVER_OPMODE_ON_SAV=active
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
# "powersave" under intel_pstate active is
# Energy Performance Preference (HWP.EPP)
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
# P-state window (% of max performance)
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=55
# Turbo
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_SAV=0
# keep: 125H base clock is very low; turbo-off on B
# stops I/O-wait boosting on battery
# ---------- Platform profile (hp-wmi) ----------
# Generic HP laptops expose a subset of: quiet cool balanced performance.
# TLP tries space-separated values in order until one is accepted.
PLATFORM_PROFILE_ON_AC="performance balanced"
PLATFORM_PROFILE_ON_BAT="balanced"
PLATFORM_PROFILE_ON_SAV="low-power quiet cool"
# ---------- Storage (NVMe) ----------
DISK_DEVICES="nvme0n1"
DISK_IOSCHED="none"
# NVMe: no scheduler overhead
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_ON_SAV=auto
AHCI_RUNTIME_PM_TIMEOUT=15
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60
MAX_LOST_WORK_SECS_ON_SAV=60
# ---------- PCIe runtime PM + ASPM ----------
RUNTIME_PM_ON_AC=auto
# iGPU-only machine: safe on AC too, lowers idle dr
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ON_SAV=auto
# TLP 1.10 default excludes: amdgpu mei_me nouveau nvidia xhci_hcd
# Stage 1 (safe):
keep the default (leave the line commented)
# Stage 2 (advanced, test USB hotplug/charging first): let xHCI + MEI suspend too
#RUNTIME_PM_DRIVER_DENYLIST=""
#RUNTIME_PM_DISABLE="00:14.0"
# example: pin a single misbehaving device to 'on'
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=powersupersave
# promote to BAT once proven stable on your unit
# ---------- Intel GPU ----------
# Only effective with the xe driver on kernel >= 6.18 (see section 5)
INTEL_GPU_POWER_PROFILE_ON_AC=base
INTEL_GPU_POWER_PROFILE_ON_BAT=power_saving
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving
# ---------- Wi-Fi / radios ----------
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
WIFI_PWR_ON_SAV=on
WOL_DISABLE=Y
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth"
DEVICES_TO_DISABLE_ON_STARTUP=""
DEVICES_TO_ENABLE_ON_AC=""
# ---------- Audio ----------
SOUND_POWER_SAVE_ON_AC=1
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_ON_SAV=1
SOUND_POWER_SAVE_CONTROLLER=Y
# ---------- USB ----------
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=0
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1
USB_EXCLUDE_WWAN=0
#USB_DENYLIST="xxxx:yyyy"
# set 1 if BT mice/headsets stutter after idle
# keep phones charging
# IDs from `tlp-stat -u` for devices that don't wak
